<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Politik Code</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #1a1a1a;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: white;
      padding: 48px 36px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111;
    }

    .subtitle {
      font-size: 15px;
      color: #555;
      margin-bottom: 12px;
    }

    .description {
      font-size: 16px;
      color: #333;
      margin-bottom: 36px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      margin-bottom: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: #1F4E79;
      color: white;
    }

    .btn-primary:hover {
      background-color: #163a5f;
    }

    .btn-secondary {
      background-color: #f1f3f5;
      color: #1F4E79;
      border: 1px solid #dee2e6;
    }

    .btn-secondary:hover {
      background-color: #e9ecef;
    }

    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Politik Code</h1>
    <p class="subtitle">Python • Análise de Conteúdo • Estatística • Web Scraping</p>
    <p class="description">
      Dados sem complicação para cientistas sociais.<br>
      Cursos gravados com método e aplicação real.
    </p>

    <!-- TROQUE O LINK ABAIXO PELO SEU GOOGLE FORM -->
    <a href="COLE_AQUI_O_LINK_DO_SEU_GOOGLE_FORM" class="btn btn-primary">
      Entrar na lista de espera
    </a>

    <!-- Link do curso -->
    <a href="https://app.nutror.com/curso/a6d176dab619042caea5be8cb342dce1dfc1fed3" class="btn btn-secondary">
      Conhecer o curso
    </a>

    <p class="footer">
      @politikcode
    </p>
  </div>
</body>
</html>
